<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno de mágicas</title>
<meta name="description" content="Catálogo pessoal de mágicas: vídeo de origem, categoria, status e o passo a passo.">
<meta name="theme-color" content="#123F38">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mágicas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#123F38; --felt-2:#0D2F2A; --card:#F7F3E9; --card-2:#EDE7D8;
    --ink:#17191A; --ink-soft:#5A605C; --red:#B4342B; --brass:#C8A64B;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--felt); color:var(--card);
    font-family:'Karla',ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  body.travado{overflow:hidden}
  .wrap{max-width:640px;margin:0 auto;
    padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(40px + var(--safe-b))}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;
    -webkit-tap-highlight-color:transparent}
  input,textarea{font:inherit;width:100%}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}

  h1.titulo{font-family:'Bodoni Moda',Didot,Georgia,serif;font-weight:400;
    font-size:clamp(30px,9vw,44px);line-height:.98;letter-spacing:-.01em;margin:0 0 6px}
  .sub{color:#A8BDB6;font-size:14px;margin:0 0 20px;line-height:1.5}

  .placar{display:flex;gap:8px;margin-bottom:18px}
  .placar button{flex:1;background:var(--felt-2);border:1px solid rgba(247,243,233,.14);
    border-radius:2px;padding:11px 8px;text-align:left;transition:border-color .15s}
  .placar button[data-on="true"]{border-color:var(--brass);background:#0A2621}
  .placar .n{font-family:'Bodoni Moda',serif;font-size:22px;display:block;line-height:1}
  .placar .l{font-size:11.5px;color:#9DB3AC;display:block;margin-top:3px}

  .barra{display:flex;gap:8px;margin-bottom:12px}
  .busca{flex:1;background:var(--felt-2);border:1px solid rgba(247,243,233,.16);
    color:var(--card);padding:13px 12px;border-radius:2px;font-size:16px;min-height:48px}
  .busca::placeholder{color:#7F958E}
  .add{background:var(--brass);color:#17191A;font-weight:700;padding:0 18px;border-radius:2px;
    white-space:nowrap;font-size:15px;min-height:48px}

  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;font-size:13px;padding:8px 13px;border-radius:20px;
    border:1px solid rgba(247,243,233,.22);color:#CFDCD8}
  .chip[data-on="true"]{background:var(--card);color:var(--ink);border-color:var(--card);font-weight:500}

  .ficha{background:var(--card);color:var(--ink);border-radius:3px;padding:13px;margin-bottom:10px;
    display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 0 rgba(0,0,0,.25);
    width:100%;text-align:left;cursor:pointer;position:relative}
  .ficha[data-rep="true"]{box-shadow:inset 5px 0 0 var(--red),0 1px 0 rgba(0,0,0,.25);
    padding-left:18px}
  .no-palco{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    color:var(--red);border:1px solid var(--red);padding:5px 10px;border-radius:20px}
  .estrela{position:absolute;top:7px;right:5px;width:42px;height:42px;display:grid;
    place-items:center;font-size:20px;line-height:1;color:#C9C0AA;border-radius:50%}
  .estrela[data-on="true"]{color:var(--red)}
  .estrela:active{background:var(--card-2)}
  .ficha .ft{padding-right:36px}

  .faixa-rep{margin:0 0 12px}
  .faixa-rep button{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--felt-2);border:1px solid var(--red);color:#F0D6D3;
    padding:13px 10px;border-radius:2px;font-size:14px;font-weight:700}
  .faixa-rep button[data-on="true"]{background:var(--red);color:#FFF3F1}
  .ficha:active{background:#F1ECDF}
  .thumb,.thumb-vazia{width:88px;height:66px;flex:0 0 88px;border-radius:2px;background:var(--card-2)}
  .thumb{object-fit:cover;display:block}
  .thumb-vazia{display:grid;place-items:center;color:#B3A98F;font-size:24px;font-family:'Bodoni Moda',serif}
  .corpo{min-width:0;flex:1}
  .ft{font-weight:700;font-size:16px;line-height:1.25;margin:0 0 7px;color:var(--ink)}
  .fd{font-size:13.5px;color:var(--ink-soft);line-height:1.45;margin:7px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .tag{font-size:11.5px;background:var(--card-2);padding:3px 7px;border-radius:2px;color:#4A4F4B}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#3D423F;
    border:1px solid #D8D0BC;padding:6px 11px;border-radius:20px;background:#fff}
  .st i{width:7px;height:7px;border-radius:50%;display:block;flex:0 0 7px}
  .leia{font-size:12.5px;color:var(--red);margin-top:9px;display:block;
    text-decoration:underline;text-underline-offset:2px}

  .vazio{border:1px dashed rgba(247,243,233,.28);border-radius:3px;padding:28px 20px;
    text-align:center;color:#A8BDB6;font-size:14px;line-height:1.5}

  .rodape-app{margin-top:24px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  .rodape-app button{font-size:13px;color:#8FA8A1;text-decoration:underline;
    text-underline-offset:3px;padding:8px 4px}

  /* ---------- folhas ---------- */
  .fundo{position:fixed;inset:0;background:rgba(7,25,22,.75);display:none;
    align-items:flex-end;justify-content:center;z-index:20}
  .fundo.on{display:flex}
  .modal{background:var(--card);color:var(--ink);width:100%;max-width:560px;
    height:94dvh;max-height:94dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    border-radius:10px 10px 0 0;padding:20px 16px calc(24px + var(--safe-b));
    position:relative}
  .modal h2{font-family:'Bodoni Moda',serif;font-weight:400;font-size:25px;line-height:1.1;
    margin:0 0 16px;padding-right:44px}
  .modal h3{font-size:14px;margin:0 0 4px;font-weight:700}
  .fechar-x{position:absolute;top:14px;right:12px;width:38px;height:38px;border-radius:50%;
    background:var(--card-2);color:#4A4F4B;font-size:19px;line-height:1;display:grid;place-items:center}

  .campo{margin-bottom:16px}
  .campo label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  .campo input,.campo textarea{background:#fff;border:1px solid #D8D0BC;border-radius:2px;
    padding:12px;color:var(--ink);font-size:16px}
  .campo textarea{min-height:230px;resize:vertical;line-height:1.5}
  #f-desc{min-height:58dvh;resize:none;overflow:hidden;line-height:1.6;padding:14px}
  .dica{font-size:12px;color:#7A807B;margin:6px 0 0;line-height:1.45}
  .op{display:flex;gap:6px;flex-wrap:wrap}
  .op button{border:1px solid #D8D0BC;border-radius:20px;padding:9px 13px;font-size:13.5px;color:#4A4F4B}
  .op button[data-on="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .catnova{display:flex;gap:6px;margin-top:8px}
  .catnova input{border:1px solid #D8D0BC;border-radius:2px;padding:10px;font-size:16px;background:#fff}
  .catnova button{border:1px solid #D8D0BC;border-radius:2px;padding:0 14px;font-size:14px}

  .acoes-fixas{position:sticky;bottom:0;background:var(--card);border-top:1px solid #E2DAC7;
    display:flex;gap:10px;align-items:center;padding:12px 0 4px;margin-top:20px}
  .salvar{background:var(--ink);color:var(--card);padding:14px 20px;border-radius:2px;font-weight:700;flex:1}
  .cancelar{color:var(--ink-soft);padding:14px 8px;font-size:14px}
  .apagar{color:var(--red);font-size:13.5px;padding:14px 4px;margin-left:auto}

  /* ---------- leitura ---------- */
  .cabeca{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .botao-video{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#FFF6F4;
    padding:11px 16px;border-radius:2px;font-size:14px;font-weight:700;text-decoration:none}
  .leitura{font-size:16px;line-height:1.62;color:#2A2E2B;padding-bottom:4px}
  .leitura p{margin:0 0 15px}
  .leitura ol,.leitura ul{margin:0 0 15px;padding-left:24px}
  .leitura li{margin-bottom:11px;padding-left:3px}
  .leitura li::marker{color:var(--red);font-weight:700}
  .leitura strong{color:var(--ink);font-weight:700}
  .leitura h4{font-family:'Bodoni Moda',serif;font-weight:600;font-size:19px;line-height:1.2;
    margin:26px 0 12px;color:var(--ink)}
  .leitura h4:first-child{margin-top:0}
  .leitura code{background:var(--card-2);padding:2px 6px;border-radius:2px;
    font-family:ui-monospace,Menlo,monospace;font-size:14px}
  .leitura .sem{color:#8A908B;font-style:italic}
  .capa{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;margin-bottom:14px;
    background:var(--card-2);display:block}

  .bloco{border-top:1px solid #E2DAC7;padding-top:16px;margin-top:18px}
  .txt{font-size:13px;color:var(--ink-soft);line-height:1.45;margin:0 0 10px}
  .json{width:100%;min-height:96px;background:#FBF9F3;border:1px solid #D8D0BC;border-radius:2px;
    padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.4;
    color:#4A4F4B;resize:vertical;margin-top:10px}
  .linha-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .btn-escuro{background:var(--ink);color:var(--card);padding:12px 16px;border-radius:2px;font-weight:700;font-size:14px}
  .btn-claro{border:1px solid #D8D0BC;padding:12px 14px;border-radius:2px;font-size:14px;color:#4A4F4B}
  .btn-arquivo{border:1px solid #D8D0BC;padding:12px 14px;border-radius:2px;font-size:14px;
    color:#4A4F4B;display:inline-block;cursor:pointer}
  .btn-arquivo input{display:none}
  .nota{font-size:12.5px;color:#2F6B4F;margin-top:10px;line-height:1.4}
  ol.passos{padding-left:20px;font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0}
  ol.passos li{margin-bottom:6px}

  /* ---------- foto própria ---------- */
  .campo-foto{display:flex;gap:11px;align-items:center}
  .previa{width:92px;height:69px;flex:0 0 92px;border-radius:2px;object-fit:cover;
    background:var(--card-2);border:1px solid #D8D0BC}
  .previa-vazia{width:92px;height:69px;flex:0 0 92px;border-radius:2px;background:var(--card-2);
    border:1px dashed #C9C0AA;display:grid;place-items:center;color:#9C9488;font-size:11px}
  .acoes-foto{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .btn-foto{border:1px solid #D8D0BC;border-radius:2px;padding:11px 14px;font-size:14px;
    color:#4A4F4B;background:#fff;cursor:pointer;display:inline-block}
  .btn-foto input{display:none}
  .tirar-foto{font-size:13px;color:var(--red);text-decoration:underline;text-underline-offset:2px}

  /* ---------- portfólio ---------- */
  .resumo-show{background:var(--felt-2);border:1px solid rgba(247,243,233,.14);border-radius:2px;
    padding:12px 14px;margin-bottom:12px;font-size:13.5px;color:#BDD0CA;line-height:1.5}
  .resumo-show b{color:var(--card);font-weight:700}
  .add-largo{flex:1;text-align:center;padding:14px 18px}

  .num-item{background:var(--card);color:var(--ink);border-radius:3px;margin-bottom:10px;
    box-shadow:0 1px 0 rgba(0,0,0,.25);display:flex;align-items:stretch;overflow:hidden}
  .ordem{flex:0 0 44px;background:var(--card-2);display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:6px 0}
  .ordem .pos{font-family:'Bodoni Moda',serif;font-size:20px;line-height:1;color:#6E7A74;
    padding:4px 0}
  .ordem button{width:40px;height:34px;display:grid;place-items:center;font-size:15px;
    color:#5C6560;border-radius:2px}
  .ordem button:disabled{opacity:.25}
  .ordem button:active:not(:disabled){background:#DFD7C3}
  .corpo-item{flex:1;min-width:0;padding:12px;display:flex;gap:11px;align-items:flex-start;
    text-align:left;cursor:pointer;background:none;border:none;color:inherit;width:100%}
  .corpo-item:active{background:#F1ECDF}
  .mini{width:76px;height:57px;flex:0 0 76px;border-radius:2px;object-fit:cover;background:var(--card-2)}
  .mini-vazia{width:76px;height:57px;flex:0 0 76px;border-radius:2px;background:var(--card-2);
    display:grid;place-items:center;color:#B3A98F;font-size:20px;font-family:'Bodoni Moda',serif}
  .it{font-weight:700;font-size:15px;line-height:1.25;margin:0 0 5px;color:var(--ink)}
  .ir{font-size:12.5px;color:var(--ink-soft);line-height:1.4;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .selo-origem{display:inline-block;font-size:11px;background:var(--card-2);color:#6B7570;
    padding:3px 7px;border-radius:2px;margin-top:6px}

  .escolha{display:flex;flex-direction:column;gap:9px;margin-bottom:4px}
  .escolha button{border:1px solid #D8D0BC;border-radius:2px;padding:15px 14px;text-align:left;
    font-size:15px;font-weight:700;color:var(--ink);background:#fff}
  .escolha span{display:block;font-weight:400;font-size:13px;color:var(--ink-soft);margin-top:3px}
  .lista-origem{margin-top:4px}
  .lista-origem button{width:100%;text-align:left;border:1px solid #E2DAC7;border-radius:2px;
    padding:12px;margin-bottom:7px;background:#fff;display:flex;gap:10px;align-items:center}
  .lista-origem .mini,.lista-origem .mini-vazia{width:58px;height:44px;flex:0 0 58px}
  .lista-origem .nome{font-weight:700;font-size:14px;color:var(--ink);line-height:1.25}
  .lista-origem .ja{font-size:11.5px;color:var(--red);margin-top:3px;display:block}

  /* ---------- abas ---------- */
  .abas{display:flex;gap:3px;margin:0 0 18px;background:var(--felt-2);padding:4px;
    border-radius:3px;border:1px solid rgba(247,243,233,.12);overflow-x:auto;
    scrollbar-width:none}
  .abas::-webkit-scrollbar{display:none}
  .abas button{flex:1 0 auto;padding:12px 10px;border-radius:2px;font-size:13px;color:#9DB3AC;
    font-weight:500;white-space:nowrap}
  .abas button[data-on="true"]{background:var(--card);color:var(--ink);font-weight:700}

  /* ---------- manobras ---------- */
  .grade{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){.grade{grid-template-columns:repeat(3,1fr)}}
  .mv{background:var(--card);color:var(--ink);border-radius:3px;overflow:hidden;text-align:left;
    box-shadow:0 1px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;cursor:pointer;
    padding:0;width:100%}
  .mv:active{background:#F1ECDF}
  .mv .capa-m,.mv .sem-capa{width:100%;aspect-ratio:16/9;object-fit:cover;
    background:var(--card-2);display:block}
  .mv .sem-capa{display:grid;place-items:center;color:#B3A98F;font-size:22px;
    font-family:'Bodoni Moda',serif}
  .mv .mt{font-weight:700;font-size:14px;line-height:1.3;padding:10px 10px 0;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mv .mr{padding:9px 10px 10px;display:flex;flex-direction:column;align-items:flex-start;
    gap:9px;margin-top:auto}
  .mv .st{font-size:11.5px;padding:6px 10px}
  .mv .abrir{display:block;width:100%;text-align:center;background:var(--red);color:var(--card);
    padding:11px 8px;border-radius:2px;font-size:12.5px;font-weight:700;text-decoration:none}
  .mv .abrir:active{filter:brightness(.92)}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="titulo">Caderno de mágicas</h1>
  <p class="sub" id="sub">Tudo que você viu, estudou e já levou pra mesa — com o vídeo de origem junto.</p>

  <div class="abas" id="abas">
    <button data-aba="magicas" data-on="true">Mágicas</button>
    <button data-aba="manobras" data-on="false">Manobras</button>
    <button data-aba="cardistry" data-on="false">Cardistry</button>
    <button data-aba="portfolio" data-on="false">Portfólio</button>
  </div>

  <div id="vista-magicas">
    <div class="placar" id="placar"></div>

    <div class="barra">
      <input class="busca" id="busca" placeholder="Buscar por título, tag ou descrição" autocomplete="off">
      <button class="add" id="btn-nova">Nova</button>
    </div>

    <div class="faixa-rep" id="faixa-rep"></div>
    <div class="chips" id="chips"></div>
    <div id="lista"></div>
  </div>

  <div id="vista-manobras" hidden>
    <div class="placar" id="placar-m"></div>

    <div class="barra">
      <input class="busca" id="busca-m" placeholder="Buscar manobra" autocomplete="off">
      <button class="add" id="btn-nova-m">Nova</button>
    </div>

    <div id="grade" class="grade"></div>
  </div>

  <div id="vista-cardistry" hidden>
    <div class="placar" id="placar-c"></div>

    <div class="barra">
      <input class="busca" id="busca-c" placeholder="Buscar movimento" autocomplete="off">
      <button class="add" id="btn-nova-c">Novo</button>
    </div>

    <div id="grade-c" class="grade"></div>
  </div>

  <div id="vista-portfolio" hidden>
    <div class="resumo-show" id="resumo-show"></div>

    <div class="barra">
      <button class="add add-largo" id="btn-add-port">Adicionar número</button>
    </div>

    <div id="roteiro"></div>
  </div>

  <div class="rodape-app">
    <button id="btn-instalar" hidden>Instalar no celular</button>
    <button id="btn-backup">Backup e restauração</button>
  </div>
</div>

<div class="fundo" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(function () {
  "use strict";

  var KEY = "magicas:v1";
  var STATUS = [
    { id: "vista", label: "Só vi", dot: "#C8A64B" },
    { id: "aprendendo", label: "Estudando", dot: "#D8752F" },
    { id: "executada", label: "Já executei", dot: "#4E9C6B" }
  ];
  var CATEGORIAS_BASE = ["Matemática","Preparação","Manobra","Cartomagia","Mentalismo","Moedas","Impromptu"];

  var MSTATUS = [
    { id: "treinando", label: "Treinando", dot: "#D8752F" },
    { id: "faco", label: "Já faço", dot: "#4E9C6B" }
  ];

  var tricks = [];
  var busca = "", filtroCat = "todas", filtroStatus = "todos", soRepertorio = false;
  var formCats = [], formStatus = "vista", formRep = false, editandoId = null, lendoId = null;
  var promptInstalar = null;

  var aba = "magicas";

  var RECADO_CHEIO = "Não deu pra salvar: o espaço do navegador encheu. " +
    "Fotos ocupam bem mais que texto, então remova a foto de algum registro antigo " +
    "ou faça um backup e apague o que não usa mais.";

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  };
  var uid = function () { return Math.random().toString(36).slice(2, 10); };
  var acharTrick = function (id) {
    for (var i = 0; i < tricks.length; i++) if (tricks[i].id === id) return tricks[i];
    return null;
  };
  var statusOf = function (id) {
    for (var i = 0; i < STATUS.length; i++) if (STATUS[i].id === id) return STATUS[i];
    return STATUS[0];
  };
  function videoId(url) {
    if (!url) return null;
    var m = String(url).match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  /* ---------- foto própria ---------- */
  var LADO_MAX = 560;

  // Encolhe a foto antes de guardar: o armazenamento do navegador é pequeno,
  // e uma foto de celular inteira ocuparia o espaço de dezenas de registros.
  function prepararFoto(arquivo, pronto, falhou) {
    if (!arquivo || !/^image\//.test(arquivo.type)) { falhou("Isso não parece uma imagem."); return; }
    var leitor = new FileReader();
    leitor.onerror = function () { falhou("Não consegui ler esse arquivo."); };
    leitor.onload = function () {
      var img = new Image();
      img.onerror = function () { falhou("Não consegui abrir essa imagem."); };
      img.onload = function () {
        var escala = Math.min(1, LADO_MAX / Math.max(img.width, img.height));
        var l = Math.max(1, Math.round(img.width * escala));
        var a = Math.max(1, Math.round(img.height * escala));
        var cv = document.createElement("canvas");
        cv.width = l; cv.height = a;
        var ctx = cv.getContext("2d");
        ctx.fillStyle = "#EDE7D8"; ctx.fillRect(0, 0, l, a);
        ctx.drawImage(img, 0, 0, l, a);
        try { pronto(cv.toDataURL("image/jpeg", 0.72)); }
        catch (e) { falhou("Não consegui converter essa imagem."); }
      };
      img.src = String(leitor.result || "");
    };
    leitor.readAsDataURL(arquivo);
  }

  // Monta o campo de foto do formulário. Devolve uma função que lê o valor atual.
  function campoFoto(idBase, valorInicial) {
    var atual = valorInicial || "";
    setTimeout(function () {
      var caixa = $(idBase + "-foto"); if (!caixa) return;
      function pintar() {
        caixa.innerHTML =
          (atual
            ? '<img class="previa" alt="" src="' + atual + '">'
            : '<div class="previa-vazia">sem foto</div>') +
          '<div class="acoes-foto">' +
          '<label class="btn-foto">' + (atual ? "Trocar foto" : "Escolher foto") +
          '<input type="file" accept="image/*"></label>' +
          (atual ? '<button type="button" class="tirar-foto">Remover foto</button>' : "") +
          "</div>";
        caixa.querySelector("input").addEventListener("change", function (e) {
          var f = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!f) return;
          prepararFoto(f, function (dados) { atual = dados; pintar(); },
            function (erro) { alert(erro); });
        });
        var tirar = caixa.querySelector(".tirar-foto");
        if (tirar) tirar.addEventListener("click", function () { atual = ""; pintar(); });
      }
      pintar();
    }, 0);
    return function () { return atual; };
  }

  function htmlCampoFoto(idBase, rotulo) {
    return '<div class="campo"><label>' + rotulo + "</label>" +
      '<div class="campo-foto" id="' + idBase + '-foto"></div>' +
      '<p class="dica">Serve para quando não existe vídeo: uma foto do baralho na mesa ' +
      "já ajuda a reconhecer o efeito na lista.</p></div>";
  }

  // A capa segue uma ordem: foto própria, depois o vídeo, e por fim o naipe.
  function capaHtml(item, classe, tamanhoYT) {
    if (item.foto) return '<img class="' + classe + '" alt="" src="' + item.foto + '">';
    var vid = videoId(item.link);
    if (vid) return '<img class="' + classe + '" alt="" loading="lazy" src="https://i.ytimg.com/vi/' +
      vid + "/" + (tamanhoYT || "mqdefault") + '.jpg">';
    return "";
  }

  /* ---------- formatação do passo a passo ---------- */
  function inline(t) {
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/^([^:<]{2,32}):(\s|$)/, "<strong>$1:</strong>$2");
    return t;
  }
  function formatar(texto) {
    if (!texto || !texto.trim()) return '<p class="sem">Sem descrição ainda. Toque em Editar para escrever o passo a passo.</p>';
    return String(texto).replace(/\r/g, "").split(/\n\s*\n/).map(function (bloco) {
      var linhas = bloco.split("\n").filter(function (l) { return l.trim() !== ""; });
      if (!linhas.length) return "";
      if (linhas.length === 1 && /^\s*#{1,6}\s+/.test(linhas[0])) {
        return "<h4>" + inline(linhas[0].replace(/^\s*#{1,6}\s+/, "")) + "</h4>";
      }
      var numerado = linhas.every(function (l) { return /^\s*\d+[.)]\s+/.test(l); });
      var marcado = linhas.every(function (l) { return /^\s*[-–—•*]\s+/.test(l); });
      if (numerado) {
        var inicio = parseInt(linhas[0].match(/\d+/)[0], 10) || 1;
        return '<ol start="' + inicio + '">' + linhas.map(function (l) {
          return "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>";
        }).join("") + "</ol>";
      }
      if (marcado) {
        return "<ul>" + linhas.map(function (l) {
          return "<li>" + inline(l.replace(/^\s*[-–—•*]\s+/, "")) + "</li>";
        }).join("") + "</ul>";
      }
      return "<p>" + linhas.map(inline).join("<br>") + "</p>";
    }).join("");
  }
  function resumo(texto) {
    return String(texto || "").replace(/[`*#>]/g, "").replace(/\s+/g, " ").trim();
  }

  /* ---------- dados ---------- */
  function carregar() {
    try {
      var raw = localStorage.getItem(KEY);
      tricks = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(tricks)) tricks = [];
    } catch (e) { tricks = []; }
  }
  function salvarTudo() {
    try { localStorage.setItem(KEY, JSON.stringify(tricks)); }
    catch (e) { alert(RECADO_CHEIO); }
    render();
  }
  function categorias() {
    var todas = CATEGORIAS_BASE.slice();
    tricks.forEach(function (t) {
      (t.categorias || []).forEach(function (c) { if (todas.indexOf(c) === -1) todas.push(c); });
    });
    return todas;
  }
  function visiveis() {
    var q = busca.trim().toLowerCase();
    return tricks.filter(function (t) {
      if (soRepertorio && !t.repertorio) return false;
      if (filtroStatus !== "todos" && t.status !== filtroStatus) return false;
      if (filtroCat !== "todas" && (t.categorias || []).indexOf(filtroCat) === -1) return false;
      if (!q) return true;
      var alvo = (t.titulo + " " + (t.descricao || "") + " " + (t.categorias || []).join(" ")).toLowerCase();
      return alvo.indexOf(q) !== -1;
    }).sort(function (a, b) {
      // o repertório do momento vem sempre primeiro
      var ra = a.repertorio ? 1 : 0, rb = b.repertorio ? 1 : 0;
      if (ra !== rb) return rb - ra;
      return (b.criadoEm || 0) - (a.criadoEm || 0);
    });
  }

  /* ---------- tela principal ---------- */
  function render() {
    var cont = {};
    STATUS.forEach(function (s) { cont[s.id] = 0; });
    tricks.forEach(function (t) { if (cont[t.status] != null) cont[t.status]++; });

    $("placar").innerHTML = STATUS.map(function (s) {
      return '<button data-status="' + s.id + '" data-on="' + (filtroStatus === s.id) + '">' +
        '<span class="n" style="color:' + s.dot + '">' + cont[s.id] + "</span>" +
        '<span class="l">' + esc(s.label) + "</span></button>";
    }).join("");

    var noRep = 0;
    tricks.forEach(function (t) { if (t.repertorio) noRep++; });
    $("faixa-rep").innerHTML = noRep
      ? '<button id="btn-rep" data-on="' + soRepertorio + '">&#9733; No meu repertório &middot; ' + noRep + "</button>"
      : "";

    $("chips").innerHTML =
      '<button class="chip" data-cat="todas" data-on="' + (filtroCat === "todas") + '">Todas</button>' +
      categorias().map(function (c) {
        return '<button class="chip" data-cat="' + esc(c) + '" data-on="' + (filtroCat === c) + '">' + esc(c) + "</button>";
      }).join("");

    var lista = visiveis();
    if (!lista.length) {
      $("lista").innerHTML = '<div class="vazio">' + (tricks.length === 0
        ? "Comece pelo último vídeo que te deixou curioso: cole o link, diga do que se trata e marque se já executou."
        : (soRepertorio
            ? "Nada no repertório com esses filtros. Toque na estrela de uma mágica para trazê-la pra cá."
            : "Nada com esses filtros. Limpe a busca ou volte pra Todas.")) + "</div>";
      return;
    }

    $("lista").innerHTML = lista.map(function (t) {
      var s = statusOf(t.status);
      var thumb = capaHtml(t, "thumb") || '<div class="thumb-vazia" aria-hidden="true">&spades;</div>';
      var tags = (t.categorias || []).length
        ? '<div class="tags">' + t.categorias.map(function (c) { return '<span class="tag">' + esc(c) + "</span>"; }).join("") + "</div>"
        : "";
      var desc = t.descricao ? '<p class="fd">' + esc(resumo(t.descricao)) + "</p>" : "";
      return '<article class="ficha" data-rep="' + (t.repertorio ? "true" : "false") +
        '" data-abrir="' + t.id + '" role="button" tabindex="0">' + thumb +
        '<button class="estrela" data-estrela="' + t.id + '" data-on="' + (t.repertorio ? "true" : "false") +
        '" title="Repertório do momento" aria-label="Marcar como repertório do momento">' +
        (t.repertorio ? "&#9733;" : "&#9734;") + "</button>" +
        '<div class="corpo"><h3 class="ft">' + esc(t.titulo) + "</h3>" +
        '<button class="st" data-ciclar="' + t.id + '" title="Mudar o status">' +
        '<i style="background:' + s.dot + '"></i>' + esc(s.label) + "</button>" +
        tags + desc +
        '<span class="leia">Abrir passo a passo</span>' +
        "</div></article>";
    }).join("");
  }

  /* ---------- folhas ---------- */
  function abrirOverlay(html) {
    $("modal").innerHTML = html;
    $("modal").scrollTop = 0;
    $("overlay").classList.add("on");
    document.body.classList.add("travado");
  }
  function fecharOverlay() {
    $("overlay").classList.remove("on");
    $("modal").innerHTML = "";
    document.body.classList.remove("travado");
    editandoId = null; lendoId = null;
  }

  function abrirLeitura(t) {
    lendoId = t.id;
    var s = statusOf(t.status), vid = videoId(t.link), capa = capaHtml(t, "capa", "hqdefault");
    abrirOverlay(
      '<button class="fechar-x" id="l-x" aria-label="Fechar">&times;</button>' +

      '<button class="st" id="l-status"><i style="background:' + s.dot + '"></i>' + esc(s.label) + "</button>" +
      '<button class="no-palco" id="l-rep" style="' + (t.repertorio ? "" : "opacity:.45") + '">' +
      (t.repertorio ? "&#9733; No repertório" : "&#9734; Pôr no repertório") + "</button>" +
      (t.link ? '<a class="botao-video" href="' + esc(t.link) + '" target="_blank" rel="noreferrer">Ver o vídeo</a>' : "") +
      "</div>" +
      ((t.categorias || []).length
        ? '<div class="tags" style="margin-bottom:16px">' + t.categorias.map(function (c) {
            return '<span class="tag">' + esc(c) + "</span>"; }).join("") + "</div>"
        : "") +
      '<div class="leitura">' + formatar(t.descricao) + "</div>" +
      '<div class="acoes-fixas"><button class="salvar" id="l-editar">Editar</button>' +
      '<button class="cancelar" id="l-fechar">Fechar</button></div>'
    );
    $("l-x").addEventListener("click", fecharOverlay);
    $("l-fechar").addEventListener("click", fecharOverlay);
    $("l-editar").addEventListener("click", function () { abrirForm(acharTrick(lendoId)); });
    $("l-rep").addEventListener("click", function () {
      alternarRep(t.id);
      var atual = acharTrick(t.id);
      $("l-rep").innerHTML = atual.repertorio ? "&#9733; No repertório" : "&#9734; Pôr no repertório";
      $("l-rep").setAttribute("style", atual.repertorio ? "" : "opacity:.45");
    });
    $("l-status").addEventListener("click", function () {
      ciclar(t.id);
      var novo = statusOf(acharTrick(t.id).status);
      $("l-status").innerHTML = '<i style="background:' + novo.dot + '"></i>' + esc(novo.label);
    });
  }

  function abrirForm(t) {
    editandoId = t ? t.id : null;
    formCats = t ? (t.categorias || []).slice() : [];
    formStatus = t ? t.status : "vista";
    formRep = t ? !!t.repertorio : false;
    var lerFoto = campoFoto("f", t ? t.foto : "");
    var cats = categorias();
    formCats.forEach(function (c) { if (cats.indexOf(c) === -1) cats.push(c); });

    abrirOverlay(
      '<button class="fechar-x" id="f-x" aria-label="Fechar">&times;</button>' +
      "<h2>" + (t ? "Editar mágica" : "Nova mágica") + "</h2>" +
      '<div class="campo"><label for="f-titulo">Título</label>' +
      '<input id="f-titulo" value="' + esc(t ? t.titulo : "") + '" placeholder="Ex.: Mágica dos 6 montes até 13"></div>' +
      '<div class="campo"><label for="f-link">Link do vídeo</label>' +
      '<input id="f-link" value="' + esc(t ? t.link || "" : "") + '" placeholder="Cole o endereço do YouTube" inputmode="url"></div>' +
      htmlCampoFoto("f", "Foto da mágica") +
      '<div class="campo"><label>Categorias</label><div class="op" id="f-cats">' +
      cats.map(function (c) {
        return '<button data-cat="' + esc(c) + '" data-on="' + (formCats.indexOf(c) !== -1) + '">' + esc(c) + "</button>";
      }).join("") +
      '</div><div class="catnova"><input id="f-novacat" placeholder="Criar outra categoria">' +
      '<button id="f-addcat">Criar</button></div></div>' +
      '<div class="campo"><label>Está no seu repertório agora?</label><div class="op" id="f-rep">' +
      '<button data-rep="sim" data-on="' + formRep + '">Sim, estou fazendo</button>' +
      '<button data-rep="nao" data-on="' + (!formRep) + '">Ainda não</button></div></div>' +
      '<div class="campo"><label>Em que ponto você está</label><div class="op" id="f-status">' +
      STATUS.map(function (s) {
        return '<button data-st="' + s.id + '" data-on="' + (formStatus === s.id) + '">' + esc(s.label) + "</button>";
      }).join("") + "</div></div>" +
      '<div class="campo"><label for="f-desc">Passo a passo</label>' +
      '<textarea id="f-desc" placeholder="Preparação: nenhuma.&#10;&#10;1. Vire a primeira carta…&#10;2. Repita com a próxima…">' +
      esc(t ? t.descricao || "" : "") + "</textarea>" +
      '<p class="dica">Linha em branco separa os blocos. Linhas começando com <code>1.</code> viram lista numerada, ' +
      'com <code>-</code> viram lista de tópicos. Use <code>**negrito**</code> e <code>`destaque`</code>. ' +
      'Começar um parágrafo com “Algo:” deixa o rótulo em negrito.</p></div>' +
      '<div class="acoes-fixas"><button class="salvar" id="f-salvar">' +
      (t ? "Salvar" : "Adicionar") + "</button>" +
      '<button class="cancelar" id="f-cancelar">Cancelar</button>' +
      (t ? '<button class="apagar" id="f-apagar">Apagar</button>' : "") + "</div>"
    );

    $("f-cats").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-cat]"); if (!b) return;
      var c = b.getAttribute("data-cat"), i = formCats.indexOf(c);
      if (i === -1) formCats.push(c); else formCats.splice(i, 1);
      b.setAttribute("data-on", i === -1);
    });
    $("f-rep").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-rep]"); if (!b) return;
      formRep = b.getAttribute("data-rep") === "sim";
      Array.prototype.forEach.call($("f-rep").children, function (x) {
        x.setAttribute("data-on", (x.getAttribute("data-rep") === "sim") === formRep);
      });
    });
    $("f-status").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-st]"); if (!b) return;
      formStatus = b.getAttribute("data-st");
      Array.prototype.forEach.call($("f-status").children, function (x) {
        x.setAttribute("data-on", x.getAttribute("data-st") === formStatus);
      });
    });
    function criarCat() {
      var v = $("f-novacat").value.trim(); if (!v) return;
      if (formCats.indexOf(v) === -1) formCats.push(v);
      var existe = false;
      Array.prototype.forEach.call($("f-cats").children, function (x) {
        if (x.getAttribute("data-cat") === v) { existe = true; x.setAttribute("data-on", "true"); }
      });
      if (!existe) {
        var b = document.createElement("button");
        b.setAttribute("data-cat", v); b.setAttribute("data-on", "true"); b.textContent = v;
        $("f-cats").appendChild(b);
      }
      $("f-novacat").value = "";
    }
    // a área de escrita cresce junto com o texto, sem rolagem interna
    var desc = $("f-desc");
    function crescer() {
      desc.style.height = "auto";
      desc.style.height = desc.scrollHeight + 2 + "px";
    }
    desc.addEventListener("input", crescer);
    setTimeout(crescer, 0);

    $("f-addcat").addEventListener("click", criarCat);
    $("f-novacat").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); criarCat(); }
    });
    $("f-x").addEventListener("click", voltarOuFechar);
    $("f-cancelar").addEventListener("click", voltarOuFechar);
    if ($("f-apagar")) $("f-apagar").addEventListener("click", function () {
      if (!confirm("Apagar esta mágica do caderno?")) return;
      tricks = tricks.filter(function (x) { return x.id !== editandoId; });
      fecharOverlay(); salvarTudo();
    });
    $("f-salvar").addEventListener("click", function () {
      var titulo = $("f-titulo").value.trim();
      if (!titulo) { $("f-titulo").focus(); return; }
      var dados = {
        titulo: titulo,
        link: $("f-link").value.trim(),
        foto: lerFoto(),
        categorias: formCats.slice(),
        status: formStatus,
        repertorio: formRep,
        descricao: $("f-desc").value
      };
      var id = editandoId;
      if (id) {
        tricks = tricks.map(function (x) { return x.id === id ? Object.assign({}, x, dados) : x; });
      } else {
        id = uid();
        tricks.unshift(Object.assign({ id: id, criadoEm: Date.now() }, dados));
      }
      editandoId = null;
      salvarTudo();
      abrirLeitura(acharTrick(id));
    });
    if (!t) $("f-titulo").focus();
  }

  function voltarOuFechar() {
    var alvo = lendoId ? acharTrick(lendoId) : null;
    if (alvo) abrirLeitura(alvo); else fecharOverlay();
  }

  function alternarRep(id) {
    tricks = tricks.map(function (t) {
      return t.id === id ? Object.assign({}, t, { repertorio: !t.repertorio }) : t;
    });
    salvarTudo();
  }

  function ciclar(id) {
    tricks = tricks.map(function (t) {
      if (t.id !== id) return t;
      var i = 0;
      STATUS.forEach(function (s, k) { if (s.id === t.status) i = k; });
      return Object.assign({}, t, { status: STATUS[(i + 1) % STATUS.length].id });
    });
    salvarTudo();
  }

  /* ---------- seções de vídeo (manobras e cardistry) ---------- */
  var mstatusOf = function (id) {
    for (var i = 0; i < MSTATUS.length; i++) if (MSTATUS[i].id === id) return MSTATUS[i];
    return MSTATUS[0];
  };

  // Monta uma seção em grade a partir da configuração: as duas abas de vídeo
  // compartilham este código, cada uma com sua chave e seus textos.
  function criarSecao(cfg) {
    var itens = [];
    var busca = "", filtroStatus = "todos", formStatus = "treinando", editando = null;

    function achar(id) {
      for (var i = 0; i < itens.length; i++) if (itens[i].id === id) return itens[i];
      return null;
    }
    function carregar() {
      try {
        var raw = localStorage.getItem(cfg.chave);
        itens = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(itens)) itens = [];
      } catch (e) { itens = []; }
    }
    function salvar() {
      try { localStorage.setItem(cfg.chave, JSON.stringify(itens)); }
      catch (e) { alert(RECADO_CHEIO); }
      render();
    }
    function visiveis() {
      var q = busca.trim().toLowerCase();
      return itens.filter(function (m) {
        if (filtroStatus !== "todos" && m.status !== filtroStatus) return false;
        return !q || m.titulo.toLowerCase().indexOf(q) !== -1;
      }).sort(function (a, b) { return (b.criadoEm || 0) - (a.criadoEm || 0); });
    }
    function render() {
      var cont = {};
      MSTATUS.forEach(function (st) { cont[st.id] = 0; });
      itens.forEach(function (m) { if (cont[m.status] != null) cont[m.status]++; });

      $(cfg.idPlacar).innerHTML = MSTATUS.map(function (st) {
        return '<button data-status="' + st.id + '" data-on="' + (filtroStatus === st.id) + '">' +
          '<span class="n" style="color:' + st.dot + '">' + cont[st.id] + "</span>" +
          '<span class="l">' + esc(st.label) + "</span></button>";
      }).join("");

      var lista = visiveis();
      if (!lista.length) {
        $(cfg.idGrade).innerHTML = '<div class="vazio" style="grid-column:1/-1">' +
          (itens.length === 0 ? cfg.vazio : "Nada com esse filtro.") + "</div>";
        return;
      }
      $(cfg.idGrade).innerHTML = lista.map(function (m) {
        var st = mstatusOf(m.status);
        var capa = capaHtml(m, "capa-m") || '<div class="sem-capa" aria-hidden="true">&spades;</div>';
        return '<article class="mv" data-editar-m="' + m.id + '" role="button" tabindex="0">' + capa +
          '<div class="mt">' + esc(m.titulo) + '</div><div class="mr">' +
          '<button class="st" data-ciclar-m="' + m.id + '" title="Mudar o status">' +
          '<i style="background:' + st.dot + '"></i>' + esc(st.label) + "</button>" +

        return faltantes.length;
      }

  var PKEY = "portfolio:v1";

  function carregarP() {
    try {
      var raw = localStorage.getItem(PKEY);
      roteiro = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(roteiro)) roteiro = [];
    } catch (e) { roteiro = []; }
  }
  function salvarP() {
    try { localStorage.setItem(PKEY, JSON.stringify(roteiro)); }
    catch (e) { alert(RECADO_CHEIO); }
    renderP();

  function acharItem(id) {
    for (var i = 0; i < roteiro.length; i++) if (roteiro[i].id === id) return roteiro[i];
    return null;
  }
  function posicao(id) {
    for (var i = 0; i < roteiro.length; i++) if (roteiro[i].id === id) return i;
    return -1;
  }
  function mover(id, passo) {
    var i = posicao(id), j = i + passo;
    if (i < 0 || j < 0 || j >= roteiro.length) return;
    var copia = roteiro.slice();
    var tmp = copia[i]; copia[i] = copia[j]; copia[j] = tmp;
    roteiro = copia;
    salvarP();
  }

      return {
        id: i.id || uid(),
        criadoEm: i.criadoEm || Date.now(),
        titulo: String(i.titulo || "").trim(),
        link: i.link || "",
        categorias: Array.isArray(i.categorias) ? i.categorias : [],
        status: st,
        foto: i.foto || "",
        repertorio: !!i.repertorio,
        descricao: i.descricao || ""
      };
    }
    function normalizarM(i) {
      var st = "treinando";
      MSTATUS.forEach(function (s) { if (s.id === i.status) st = i.status; });
      return {
        id: i.id || uid(),
        criadoEm: i.criadoEm || Date.now(),
        titulo: String(i.titulo || "").trim(),
        link: i.link || "",
        foto: i.foto || "",
        status: st
      };
    }
    function restaurar(modo) {
      var texto = $("b-cola").value.trim();
      if (!texto) { msg("Cole o conteúdo do backup ou escolha um arquivo."); return; }
      var dados;
      try { dados = JSON.parse(texto); } catch (e) { msg("Esse texto não é um backup válido."); return; }

      // backup antigo era só a lista de mágicas; o novo traz os dois cadernos
      var brutoMag = Array.isArray(dados) ? dados : (dados && Array.isArray(dados.magicas) ? dados.magicas : []);
      var brutoMan = (dados && Array.isArray(dados.manobras)) ? dados.manobras : [];
      var brutoCar = (dados && Array.isArray(dados.cardistry)) ? dados.cardistry : [];
      var brutoPort = (dados && Array.isArray(dados.portfolio)) ? dados.portfolio : [];
      var lidas = brutoMag.filter(function (d) { return d && d.titulo; }).map(normalizar);
      var lidasM = brutoMan.filter(function (d) { return d && d.titulo; }).map(normalizarM);
      var lidasC = brutoCar.filter(function (d) { return d && d.titulo; }).map(normalizarM);
      var lidasP = brutoPort.filter(function (d) { return d && d.titulo; }).map(function (i) {
        return {
          id: i.id || uid(),
          criadoEm: i.criadoEm || Date.now(),
          origemId: i.origemId || null,
          titulo: String(i.titulo || "").trim(),
          link: i.link || "",
          foto: i.foto || "",
          descricao: i.descricao || ""
        };
      });
      if (!lidas.length && !lidasM.length && !lidasC.length && !lidasP.length) {
        msg("Nenhuma mágica, manobra ou número encontrado nesse arquivo."); return;
      }

      if (modo === "substituir") {
        if (!confirm("Isso apaga as " + tricks.length + " mágicas, " + secManobras.lista().length +
          " manobras, " + secCardistry.lista().length + " movimentos e o show com " +
          roteiro.length + " números. Continuar?")) return;
        tricks = lidas;
        secManobras.definir(lidasM);
        secCardistry.definir(lidasC);
        roteiro = lidasP; salvarP();
        msg("Substituído: " + lidas.length + " mágicas, " + lidasM.length + " manobras, " +
          lidasC.length + " movimentos e " + lidasP.length + " números no show.");
      } else {
        var ids = tricks.map(function (t) { return t.id; });
        var novas = lidas.filter(function (l) { return ids.indexOf(l.id) === -1; });
        tricks = novas.concat(tricks);
        var novasM = secManobras.juntar(lidasM);
        var novasC = secCardistry.juntar(lidasC);
        var idsP = roteiro.map(function (r) { return r.id; });
        var novosP = lidasP.filter(function (l) { return idsP.indexOf(l.id) === -1; });
        roteiro = roteiro.concat(novosP); salvarP();
        msg((novas.length + novasM + novasC + novosP.length)
          ? novas.length + " mágicas, " + novasM + " manobras, " + novasC + " movimentos e " +
            novosP.length + " números adicionados."
          : "Nada novo: tudo já estava no caderno.");
      }
      $("b-cola").value = "";
      salvarTudo();
    }
    $("b-juntar").addEventListener("click", function () { restaurar("juntar"); });
    $("b-substituir").addEventListener("click", function () { restaurar("substituir"); });
    $("b-x").addEventListener("click", fecharOverlay);
    $("b-fechar").addEventListener("click", fecharOverlay);
  }

  /* ---------- eventos ---------- */
  $("busca").addEventListener("input", function (e) { busca = e.target.value; render(); });
  $("btn-nova").addEventListener("click", function () { lendoId = null; abrirForm(null); });
  $("btn-backup").addEventListener("click", abrirBackup);

  $("placar").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-status]"); if (!b) return;
    var s = b.getAttribute("data-status");
    filtroStatus = filtroStatus === s ? "todos" : s;
    render();
  });
  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-cat]"); if (!b) return;
    var c = b.getAttribute("data-cat");
    filtroCat = (c === "todas" || filtroCat === c) ? "todas" : c;
    render();
  });
  $("faixa-rep").addEventListener("click", function (e) {
    if (!e.target.closest("#btn-rep")) return;
    soRepertorio = !soRepertorio;
    render();
  });
  $("lista").addEventListener("click", function (e) {
    var es = e.target.closest("button[data-estrela]");
    if (es) { e.stopPropagation(); alternarRep(es.getAttribute("data-estrela")); return; }
    var ci = e.target.closest("button[data-ciclar]");
    if (ci) { e.stopPropagation(); ciclar(ci.getAttribute("data-ciclar")); return; }
    var ab = e.target.closest("[data-abrir]");
    if (ab) { var t = acharTrick(ab.getAttribute("data-abrir")); if (t) abrirLeitura(t); }
  });
  $("lista").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var ab = e.target.closest("[data-abrir]");
    if (ab) { e.preventDefault(); var t = acharTrick(ab.getAttribute("data-abrir")); if (t) abrirLeitura(t); }
  });
  $("abas").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-aba]"); if (!b) return;
    trocarAba(b.getAttribute("data-aba"));
  });
  $("btn-add-port").addEventListener("click", abrirEscolha);
  $("roteiro").addEventListener("click", function (e) {
    var sobe = e.target.closest("button[data-sobe]");
    if (sobe) { mover(sobe.getAttribute("data-sobe"), -1); return; }
    var desce = e.target.closest("button[data-desce]");
    if (desce) { mover(desce.getAttribute("data-desce"), 1); return; }
    var ver = e.target.closest("button[data-ver]");
    if (ver) { var it = acharItem(ver.getAttribute("data-ver")); if (it) abrirItem(it); }
  });
  $("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) fecharOverlay(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $("overlay").classList.contains("on")) fecharOverlay();
  });

  /* ---------- instalação ---------- */
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    promptInstalar = e;
    $("btn-instalar").hidden = false;
  });
  $("btn-instalar").addEventListener("click", function () {
    if (!promptInstalar) return;
    promptInstalar.prompt();
    promptInstalar.userChoice.then(function () {
      promptInstalar = null;
      $("btn-instalar").hidden = true;
    });
  });
  window.addEventListener("appinstalled", function () { $("btn-instalar").hidden = true; });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }

  carregar();
  render();
  secManobras.carregar(); secManobras.render();
  secCardistry.carregar(); secCardistry.render();
  carregarP(); renderP();
  var salva = "magicas";
  try { salva = localStorage.getItem("caderno:aba") || "magicas"; } catch (e) {}
  trocarAba(salva);
})();
</script>
</body>
</html>
